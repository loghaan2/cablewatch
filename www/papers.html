<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>cablewatch.papers backoffice</title>
<style>
/* =========================
   Global / Dark theme
   ========================= */
body {
    font-family: "Segoe UI", Roboto, Helvetica, sans-serif;
    background-color: #1e1e2f;
    color: #e0e0e0;
    margin: 2rem;
    line-height: 1.6;
}

h1 {
    margin-bottom: 1rem;
    color: #82c7ff;
}

hr {
    border: none;
    border-top: 1px solid #444;
    margin: 1.5rem 0;
}

code {
    background-color: #3a3a50;
    padding: 2px 4px;
    border-radius: 4px;
    color: #f0f0f0;
}

/* =========================
   Controls
   ========================= */
#filter {
    width: 260px;
    padding: 0.4rem 0.6rem;
    border-radius: 4px;
    border: 1px solid #555;
    background-color: #2a2a3a;
    color: #e0e0e0;
}

#filter::placeholder {
    color: #9aa0b3;
}

button {
    margin-left: 0.5rem;
    padding: 0.4rem 0.9rem;
    border-radius: 4px;
    border: none;
    background-color: #3b82f6;
    color: #fff;
    cursor: pointer;
    font-weight: 500;
}

button:hover {
    background-color: #5aa0f7;
}

/* =========================
   Table container (scroll)
   ========================= */
.table-container {
    margin-top: 1rem;
    max-height: 60vh;
    overflow-y: auto;
    border-radius: 6px;
}

/* Scrollbar dark */
.table-container::-webkit-scrollbar {
    width: 10px;
}
.table-container::-webkit-scrollbar-track {
    background: #2a2a3a;
}
.table-container::-webkit-scrollbar-thumb {
    background-color: #555;
    border-radius: 6px;
}
.table-container::-webkit-scrollbar-thumb:hover {
    background-color: #777;
}

/* Firefox */
.table-container {
    scrollbar-color: #555 #2a2a3a;
    scrollbar-width: thin;
}

/* =========================
   Table
   ========================= */
table {
    width: 100%;
    border-collapse: collapse;
    background-color: #2a2a3a;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
}

th, td {
    padding: 0.7rem 1rem;
    text-align: left;
}

thead th {
    background-color: #3b82f6;
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 1;
}

tbody tr:nth-child(even) {
    background-color: #2f2f40;
}

tbody tr:hover {
    background-color: #3a3a5a;
}

td:last-child {
    white-space: nowrap;
}

/* =========================
   Links
   ========================= */
a {
    margin-left: 0.5rem;
    text-decoration: none;
    color: #82c7ff;
    font-weight: 500;
}

a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>
<h1><code>cablewatch.papers</code> backoffice</h1>
<hr/>

<input type="text" id="filter" placeholder="UNIX filename pattern matching…">
<button id="downloadAllBtn">Download all</button>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="papersList">
            <!-- rows generated by JS -->
        </tbody>
    </table>
</div>

<script>
const listEl = document.getElementById('papersList');
const filterInput = document.getElementById('filter');
const downloadAllBtn = document.getElementById('downloadAllBtn');

let debounceTimeout = null;

async function fetchList(filter) {
    if (filter === '') filter = '*';
    const url = `/api/papers/list/${encodeURIComponent(filter)}`;
    const res = await fetch(url);
    if (!res.ok) {
        console.error('Error while fetching files');
        return [];
    }
    return await res.json();
}

function renderList(files, filter) {
    if (filter === '') filter = '*';
    listEl.innerHTML = '';
    files.forEach((file, idx) => {
        const tr = document.createElement('tr');

        const fileTd = document.createElement('td');
        fileTd.textContent = file;

        const actionsTd = document.createElement('td');

        const viewLink = document.createElement('a');
        viewLink.textContent = 'view';
        viewLink.href = `/api/papers/view/${encodeURIComponent(filter)}/${idx}`;
        viewLink.target = '_blank';

        const downloadLink = document.createElement('a');
        downloadLink.textContent = 'download';
        downloadLink.href = `/api/papers/download/${encodeURIComponent(filter)}/${idx}`;

        actionsTd.appendChild(viewLink);
        actionsTd.appendChild(downloadLink);

        tr.appendChild(fileTd);
        tr.appendChild(actionsTd);

        listEl.appendChild(tr);
    });
}

async function updateList() {
    const filter = filterInput.value;
    const files = await fetchList(filter);
    renderList(files, filter);
}

/* Live filter with debounce */
filterInput.addEventListener('input', () => {
    if (debounceTimeout) clearTimeout(debounceTimeout);
    debounceTimeout = setTimeout(updateList, 30);
});

/* Download archive */
downloadAllBtn.addEventListener('click', () => {
    const filter = filterInput.value || '*';
    const url = `/api/papers/download-archive/${encodeURIComponent(filter)}`;
    const a = document.createElement('a');
    a.href = url;
    a.download = '';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
});

/* Init */
updateList();
filterInput.focus();

/* Keep focus */
filterInput.addEventListener('blur', () => {
    setTimeout(() => filterInput.focus(), 30);
});
</script>
</body>
</html>
